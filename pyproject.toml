[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ecell4"
dynamic = ["version"]
description = "A software platform for modeling, simulation and analysis of complex, heterogeneous and multi-scale systems like the cell. E-Cell has multi-algorithm, multi-timescale and multi-spatial-representation as its central feature."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GNU General Public License v3" }
authors = [
    { name = "Kazunari Kaizu", email = "kaizu@riken.jp" },
]
urls = { Homepage = "https://github.com/ecell/ecell4" }
dependencies = [
    "ecell4-base>=2.1.0",
    "matplotlib",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]

[project.optional-dependencies]
all = ["plotly", "pint>=0.11", "numpy-stl", "pyyaml"]

[tool.setuptools.dynamic]
version = { attr = "ecell4.__version__" }

[tool.setuptools.packages.find]
include = ["ecell4*"]

[tool.setuptools.package-data]
"ecell4.util" = [
    "templates/init_ipynb.js",
    "templates/init_cyjs.js",
    "templates/template.html",
    "templates/*.tmpl",
    "templates/ecelllogo/*.png",
]
